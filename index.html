<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fawzy Sukkar — AI Engineer Roadmap</title>
  
  <link rel="icon" type="image/x-icon" href="./favicon.ico?v=2">
  <link rel="shortcut icon" type="image/x-icon" href="./favicon.ico?v=2">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <!-- Top Navbar -->
  <header class="navbar">
    <div class="nav-container">
      <div class="brand">
        <span class="brand-badge">AI</span>
        <span class="brand-name">Fawzy Sukkar</span>
      </div>
      
      <!-- Prominent Track Switcher -->
      <div class="track-switch-wrapper">
        <span class="track-label" id="track-label">اختر المسار:</span>
        <div class="track-switch" id="track-switch">
          <button class="track-btn active" id="btn-track-ibm" onclick="switchTrack('ibm')">
            <span class="track-icon">⚡</span> IBM AI Certificate
          </button>
          <button class="track-btn" id="btn-track-andrew" onclick="switchTrack('andrew')">
            <span class="track-icon">🧠</span> DeepLearning.AI
          </button>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="nav-actions">
        <button id="lang-btn" class="btn btn-secondary" onclick="toggleLanguage()">
          <span class="btn-icon">🌐</span> English
        </button>
        <button class="btn btn-primary" onclick="window.print()">
          <span class="btn-icon">📄</span> <span id="pdf-btn-text">تصدير PDF</span>
        </button>
      </div>
    </div>
  </header>

  <main class="main-wrapper">
    <!-- Hero Header -->
    <section class="hero-section">
      <div class="badge-pill" id="hero-badge">AI Engineering Curriculum</div>
      <h1 id="hero-title" class="hero-title"></h1>
      <p id="hero-subtitle" class="hero-subtitle"></p>
      
      <!-- Dynamic Roadmap Visual Card -->
      <div class="roadmap-preview-card" id="roadmap-banner">
        <img id="roadmap-img" src="./assets/images/IBM_Roadmap.png" onerror="this.src='./IBM_Roadmap.png'" alt="AI Roadmap Diagram" class="roadmap-img">
      </div>
    </section>

    <!-- Quick Navigation Bar -->
    <nav class="stages-nav" aria-label="Stages navigation">
      <div class="pills-wrapper" id="pills-container"></div>
    </nav>

    <!-- Vertical Stages Container -->
    <section class="roadmap-stages-container" id="stages-container"></section>
  </main>

  <footer class="footer">
    <p>Mohammed Fawzy Sukkar © 2026 — AI Engineering Roadmap</p>
  </footer>

  <!-- Scripts -->
  <script src="./js/content.js" defer></script>
  <script src="./js/main.js" defer></script>
</body>
</html>
